# Runs the unit tests and every frozen contract (with Python and pytest installed, so R13.6 runs), audits this repository, then re-runs the newest receipt of each example spec with necro verify.
name: Tests and receipts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Git identity for tests that make temporary repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Unit tests of the tool
        run: npm test
      - name: Frozen contracts of the tool and the viewer
        run: node --test contracts/necro-core/*.test.js contracts/receipt-viewer/*.test.js
      - name: Audit every ticked task
        run: node bin/necro.js audit
      - name: Pumpkin Ledger tests and contracts
        working-directory: examples/pumpkin-ledger
        run: node --test test/*.test.js contracts/ledger/*.test.js
      - name: Night Shift tests and contracts
        working-directory: examples/night-shift
        run: node --test test/*.test.js contracts/planner/*.test.js
      - name: Re-run the newest receipt of each example spec
        run: |
          # This repository's own receipts are snapshots: the source files they pin change with every later task.
          # `necro audit` above covers this repository, so only the two examples are re-run here.
          for dir in examples/pumpkin-ledger examples/night-shift; do
            for spec in "$dir"/.necro/receipts/*/; do
              newest=$(node -e 'const fs=require("fs"),p=require("path");const d=process.argv[1];const r=fs.readdirSync(d).map(f=>({f,t:JSON.parse(fs.readFileSync(p.join(d,f))).createdAt})).sort((a,b)=>a.t<b.t?1:-1)[0];console.log(p.join(d,r.f))' "$spec")
              echo "$newest"
              node bin/necro.js verify "$newest"
            done
          done
      - name: Leap Age contracts with pytest
        working-directory: examples/leap-age
        run: python3 -P -m pytest contracts/age -q --noconftest -p no:cacheprovider
      - name: Re-run the newest receipt of the Leap Age example
        run: |
          newest=$(node -e 'const fs=require("fs"),p=require("path");const d=process.argv[1];const r=fs.readdirSync(d).map(f=>({f,t:JSON.parse(fs.readFileSync(p.join(d,f))).createdAt})).sort((a,b)=>a.t<b.t?1:-1)[0];console.log(p.join(d,r.f))' examples/leap-age/.necro/receipts/age)
          echo "$newest"
          node bin/necro.js verify "$newest"
